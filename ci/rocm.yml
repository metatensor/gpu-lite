include:
  - remote: "https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml"

stages:
  - build
  - test

variables:
  PERSIST_IMAGE_NAME: $CSCS_REGISTRY_PATH/gpulite-rocm:$CI_COMMIT_SHORT_SHA

build rocm:
  stage: build
  extends: .container-builder-cscs-zen2
  variables:
    DOCKERFILE: ci/containers/Containerfile.rocm
    KUBERNETES_MEMORY_REQUEST: '64Gi'
    KUBERNETES_MEMORY_LIMIT: '64Gi'
    KUBERNETES_CPU_REQUEST: '16'
    KUBERNETES_CPU_LIMIT: '16'

test rocm:
  stage: test
  extends: .container-runner-beverin-mi300
  image: $PERSIST_IMAGE_NAME
  timeout: 24h
  script:
    - ctest -V --test-dir /gpu-lite/build/ -L "rocm"
  variables:
    SLURM_JOB_NUM_NODES: 1
    SLURM_PARTITION: mi300
    SLURM_NTASKS: 1
    SLURM_TIMELIMIT: "00:05:00"
    USE_MPI: "OFF"
